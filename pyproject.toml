[project]
name = "io-soulworker"
version = "1.0.0"
description = "Import-Export SoulWorker content for Blender"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fake-bpy-module-latest>=20260501",
    "mathutils>=5.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["io_soulworker"]

[tool.uv]
package = true
