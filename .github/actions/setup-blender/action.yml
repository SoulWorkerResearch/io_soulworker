name: Set up Blender
description: Download a pinned headless Blender, cache the archive and put it on PATH.

inputs:
  version:
    description: Blender version, a 5.0.x release.
    default: "5.0.1"
  sha256:
    # Take it from https://download.blender.org/release/Blender5.0/blender-<version>.sha256
    description: SHA-256 of blender-<version>-linux-x64.tar.xz.
    default: "8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09"

runs:
  using: composite
  steps:
    - name: Cache Blender archive
      uses: actions/cache@v6
      with:
        path: ~/.cache/blender-archive
        key: blender-${{ inputs.version }}-linux-x64-${{ inputs.sha256 }}

    - name: Install Blender
      shell: bash
      env:
        BLENDER_VERSION: ${{ inputs.version }}
        BLENDER_SHA256: ${{ inputs.sha256 }}
      run: |
        archive="$HOME/.cache/blender-archive/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
        if ! echo "${BLENDER_SHA256}  ${archive}" | sha256sum --check --status; then
          mkdir -p "$(dirname "${archive}")"
          curl --fail --silent --show-error --location --retry 3 \
            --output "${archive}" \
            "https://download.blender.org/release/Blender5.0/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          echo "${BLENDER_SHA256}  ${archive}" | sha256sum --check
        fi
        mkdir -p "$HOME/blender"
        tar --extract --xz --file "${archive}" --directory "$HOME/blender" --strip-components=1
        echo "$HOME/blender" >> "$GITHUB_PATH"

    - name: Install Blender runtime libraries
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends \
          libegl1 libgl1 libsm6 libx11-6 libxfixes3 libxi6 libxkbcommon0 libxrender1 libxxf86vm1

    - name: Show Blender version
      shell: bash
      run: blender --background --factory-startup --version
