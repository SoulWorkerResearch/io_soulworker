name: Tests

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      # Blender 5.0 is the add-on's target; the version is pinned in the action.
      - name: Set up Blender
        uses: ./.github/actions/setup-blender

      # There is no game tree on the runner. Tests that need unpacked game
      # files skip themselves when this directory does not exist.
      - name: Run tests
        env:
          SOULWORKER_RESOURCES: ${{ runner.temp }}/no-unpacked-resources
        run: blender --background --factory-startup --python tests/run_in_blender.py

      # The release is this zip: check that it builds, installs as an
      # extension and registers under the extension package name.
      - name: Build and install the extension
        env:
          BLENDER_USER_RESOURCES: ${{ runner.temp }}/blender-user
        run: |
          blender --command extension validate io_soulworker
          blender --command extension build --source-dir io_soulworker --output-filepath io_soulworker.zip
          blender --command extension install-file -r user_default -e io_soulworker.zip
          blender --background --python-exit-code 1 --python-expr "import bpy, sys; assert 'bl_ext.user_default.io_soulworker' in sys.modules; assert hasattr(bpy.types, 'IO_SOULWORKER_OT_import')"
