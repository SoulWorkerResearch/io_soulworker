name: Stable Deploy

on:
  push:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: stable-deploy
  cancel-in-progress: false

env:
  RELEASE_TAG: stable

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Blender
        uses: ./.github/actions/setup-blender

      # The zip is a Blender extension: blender_manifest.toml is at its root.
      - name: Build the extension
        run: |
          blender --command extension validate io_soulworker
          blender --command extension build --source-dir io_soulworker --output-filepath io_soulworker.zip

      # Replaces the previous release: the release and its tag are recreated
      # on the commit that was just pushed.
      - name: Deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${RELEASE_TAG}" > /dev/null 2>&1; then
            gh release delete "${RELEASE_TAG}" --yes --cleanup-tag
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" > /dev/null 2>&1; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}"
          fi
          gh release create "${RELEASE_TAG}" io_soulworker.zip \
            --target "${GITHUB_SHA}" \
            --title "Stable Release" \
            --notes "Automatic build of the main branch at ${GITHUB_SHA}." \
            --latest
